# Presence Moonlight [Stingor] -- ADR 0156 de moonclient.
#
# Le calendrier d'un cycle glissant de 28 jours : la Ne reclamation du cycle
# donne le jour N. Charge par le map-server (pc_attendance.cpp), publie dans la
# table SQL moonlight_attendance_calendar pour le site, envoye au client dans
# ZC_MOONLIGHT_ATTENDANCE (0x0F6F). @reloadattendancedb recharge et republie.
#
# Serveur high rate : les jours ordinaires donnent une monnaie d'event, a la
# quantite d'une trouvaille du cafard (moon/event/cafard.npc) ; les paliers
# (7, 14, 21, 28) y ajoutent des points d'event.
#
###########################################################################
# - Day                     Rang de la recompense dans le cycle (1 a 28).
#   Milestone               Jour-palier, mis en avant dans la fenetre. (Default: false)
#   EventPoints             Points d'event (#KAFRAPOINTS) credites au compte qui recoit. (Default: 0)
#   Rewards:                Items du jour (5 au plus : une livraison RODEX en porte 5).
#     - Item                Nom Aegis de l'item.
#       Amount              Quantite. (Default: 1)
# Un jour donne au moins un item ou des points d'event.
###########################################################################

Header:
  Type: MOONLIGHT_ATTENDANCE_DB
  Version: 1

