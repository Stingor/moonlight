  - Id: 310674
    AegisName: Star_Cluster_Of_Pow1
    Name: Star Cluster of Power Lv1
    Type: Card
    SubType: Enchant
    Script: |
      .@param = (readparam(bPow)/15);
      .@g = getenchantgrade();
      bonus bShortAtkRate,.@param;
      bonus bBaseAtk,5*.@param;
      if (.@g >= ENCHANTGRADE_D) {
         bonus bShortAtkRate,.@param;
         bonus2 bAddClass,Class_All,.@param;
         if (.@g >= ENCHANTGRADE_C) {
            bonus bShortAtkRate,.@param;
            bonus2 bAddClass,Class_All,.@param;
            if (.@g >= ENCHANTGRADE_B) {
               bonus bShortAtkRate,.@param;
               bonus2 bAddClass,Class_All,.@param;
               if (.@g >= ENCHANTGRADE_A) {
                  bonus bShortAtkRate,.@param;
                  bonus2 bAddClass,Class_All,.@param;
               }
            }
         }
      }
