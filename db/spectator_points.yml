###########################################################################
# Spectator Points Database
###########################################################################
#
# Where the login screen's living backdrop watches from. A spectator session
# (see SPECTATOR_USERID in src/common/mmo.hpp) is dropped on one of these spots,
# drawn at random, so the client does not always open on the same view.
#
# The spots below come from the warp agent (moon/warp_agent.npc): they are the
# arrival points players actually use, so they are known-good cells.
#
###########################################################################
#
#  - Map      Map name the session spawns on.
#    X        X coordinate on that map.
#    Y        Y coordinate on that map.
#    Rate     Relative weight of the draw. (Default: 100)
#             Weights are relative to each other, not percentages: a spot at 200
#             comes up twice as often as one at 100, and adding a spot does not
#             require touching the others. Zero disables a spot without deleting
#             it -- handy to park a view that does not look good yet.
#             Every spot below is left at the default: weighting them is a call
#             about where the players actually are.
#
# Reloadable with @reloaddb: no restart needed while hunting for good views.
#
###########################################################################
#
# Two things make a spot WORK, and neither shows in a map name:
#   - it must be CLEAR. The camera sits 35 degrees above the horizon and orbits
#     the spot; a wall two cells away fills half the screen.
#   - it must be BUSY. Seeing other players walk by is the whole point of this
#     backdrop over a static picture -- an empty corner is just a nicer wallpaper.
#
# A map this server does not serve is skipped at draw time, so a spot that stops
# working costs nothing but does nothing either.
#
###########################################################################

Header:
  Type: SPECTATOR_POINT_DB
  Version: 1

